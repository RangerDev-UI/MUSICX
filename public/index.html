<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUSICX — Find your frequency</title><style>
*{box-sizing:border-box}body{margin:0;background:#10100f;color:#f8f3eb;font:16px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 5%;border-bottom:1px solid #302b25;flex-wrap:wrap}b.logo{font-size:26px;letter-spacing:-2px;color:#ff9d35}nav{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;background:#29241e;color:#fff;padding:12px 18px}button:hover,button.active{background:#ff9d35;color:#15100a}main{max-width:1200px;margin:auto;padding:32px 24px 80px}.hero{border:1px solid #543a23;border-radius:28px;padding:clamp(24px,6vw,76px);background:radial-gradient(ellipse at 85% 30%,#a44d1b 0%,#382317 30%,#191612 67%);position:relative;overflow:hidden}.hero:after{content:'◉';position:absolute;right:5%;top:0;font-size:clamp(100px,24vw,300px);color:#ff9d3520;pointer-events:none}h1{font-size:clamp(38px,7vw,82px);line-height:1;letter-spacing:-.06em;margin:18px 0}small,p{color:#b9afa3}form{display:flex;gap:10px;margin:28px 0}input{min-width:0;flex:1;border:1px solid #493b2d;border-radius:12px;background:#1d1b18;color:white;padding:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}.tile{text-align:left;min-height:140px;padding:22px;background:linear-gradient(145deg,#473021,#211b16);border:1px solid #493728}.tile span{display:block;font-size:32px;margin-bottom:20px;color:#ff9d35}.track{display:flex;gap:12px;align-items:center;border-bottom:1px solid #302b25;padding:12px 0}.track img{width:100px;border-radius:8px}.track div{flex:1;min-width:0;overflow-wrap:anywhere}iframe{width:100%;max-width:640px;aspect-ratio:16/9;min-height:200px;border:0;border-radius:16px}section{margin-top:32px}#player[hidden]{display:none}footer{padding:24px;text-align:center;color:#938779}button:focus-visible,input:focus-visible{outline:2px solid #ffb568;outline-offset:3px}@media(max-width:500px){header{padding:16px}nav button{padding:8px}main{padding:20px 16px}.track img{width:70px}.track button{padding:10px}}
</style></head><body><header><b class="logo">◉ MUSICX</b><nav><button id="home" class="active">Home</button><button id="favorites">♥ Favorites</button><button id="history">History</button></nav></header><main><div class="hero"><small>YOUR SOUND · YOUR SPACE</small><h1>Find your<br>frequency.</h1><p>ค้นพบเสียงเพลงในแบบของคุณ</p></div><form id="search"><input id="q" aria-label="ค้นหาเพลง" placeholder="ค้นหาเพลง ศิลปิน หรืออัลบั้ม" required maxlength="100"><button class="active">ค้นหา</button></form><section id="genres"><h2>Explore by mood</h2><div class="grid" id="tiles"></div></section><section id="player" hidden><h2 id="now">Now playing</h2><div id="video"></div></section><section><h2 id="heading">เพลงแนะนำ</h2><p id="status" role="status">เลือกแนวเพลงหรือค้นหาเพลงที่คุณชอบ</p><div id="tracks"></div></section></main><footer>MUSICX · Powered by YouTube</footer><script>
const $=id=>document.getElementById(id);const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return []}};let fav=read('mx-fav'),hist=read('mx-history'),view='home',seq=0;const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};function mode(v){view=v;for(const id of ['home','favorites','history'])$(id).classList.toggle('active',id===v);$('genres').hidden=v!=='home'}function render(items){$('tracks').replaceChildren();for(const t of items){if(!/^[\w-]{11}$/.test(t.id))continue;const row=document.createElement('article');row.className='track';const img=document.createElement('img');img.src='https://i.ytimg.com/vi/'+t.id+'/mqdefault.jpg';img.alt='';img.loading='lazy';const info=document.createElement('div');const title=document.createElement('strong');title.textContent=t.title;const artist=document.createElement('p');artist.textContent=t.channel;info.append(title,artist);const play=document.createElement('button');play.textContent='▶';play.setAttribute('aria-label','เล่น '+t.title);play.onclick=()=>{ $('player').hidden=false;$('now').textContent=t.title;const f=document.createElement('iframe');f.src='https://www.youtube-nocookie.com/embed/'+t.id+'?autoplay=1';f.title=t.title;f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;$('video').replaceChildren(f);hist=[t,...hist.filter(x=>x.id!==t.id)].slice(0,50);save('mx-history',hist);$('player').scrollIntoView({behavior:'smooth'});};const heart=document.createElement('button');heart.textContent=fav.some(x=>x.id===t.id)?'♥':'♡';heart.setAttribute('aria-label','เพลงโปรด '+t.title);heart.onclick=()=>{fav=fav.some(x=>x.id===t.id)?fav.filter(x=>x.id!==t.id):[t,...fav];save('mx-fav',fav);render(view==='favorites'?fav:items)};row.append(img,info,play,heart);$('tracks').append(row)}}async function search(q){const n=++seq;mode('home');$('heading').textContent='ผลการค้นหา';$('status').textContent='กำลังค้นหา…';render([]);try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const d=await r.json();if(n!==seq)return;if(!r.ok)throw Error(d.error||'ค้นหาไม่สำเร็จ');render(d.items);$('status').textContent=d.items.length?'':'ไม่พบเพลง'}catch(e){if(n===seq)$('status').textContent=e.message}}$('search').onsubmit=e=>{e.preventDefault();search($('q').value.trim())};for(const [symbol,label,q] of [['♫','Thai Hits','เพลงไทย official music video'],['✦','Global','global pop music official video'],['☾','Chill','lofi chill music'],['⚡','Rock','rock official music video'],['♥','Love','เพลงรัก official MV'],['◌','Indie','Thai indie music']]){const b=document.createElement('button');b.className='tile';const s=document.createElement('span');s.textContent=symbol;b.append(s,label);b.onclick=()=>search(q);$('tiles').append(b)}$('home').onclick=()=>{seq++;mode('home');$('heading').textContent='เพลงแนะนำ';$('status').textContent='เลือกแนวเพลงหรือค้นหาเพลง';render([])};for(const [id,label] of [['favorites','เพลงโปรด'],['history','ประวัติการฟัง']])$(id).onclick=()=>{seq++;mode(id);$('heading').textContent=label;const a=id==='favorites'?fav:hist;$('status').textContent=a.length?'':'ยังไม่มีเพลง';render(a)};
</script></body></html>

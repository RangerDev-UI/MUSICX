$('stop').onclick=stop;$('clear').onclick=()=>{queue=[];drawQueue()};
$('shuffle').onclick=()=>{shuffle=!shuffle;$('shuffle').setAttribute('aria-pressed',String(shuffle));drawUpcoming()};
$('repeat').onclick=()=>{repeat=(repeat+1)%3;const label=['เล่นซ้ำ: ปิด','เล่นซ้ำ: เพลงเดียว','เล่นซ้ำ: ทั้งรายการ'][repeat];$('repeat').textContent=repeat===1?'↻¹':'↻';$('repeat').classList.toggle('active',repeat!==0);$('repeat').title=label;$('repeat').setAttribute('aria-label',label);drawUpcoming()};
function fmt(n){n=Math.max(0,Math.floor(Number(n)||0));const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=String(n%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+s:m+':'+s}
function updateProgress(){if(!playerReady||!current)return;try{const d=player.getDuration(),t=player.getCurrentTime();if(d>0){$('seek').disabled=false;$('seek').max=d;if(!dragging)$('seek').value=t;$('elapsed').textContent=fmt(dragging?$('seek').value:t);$('duration').textContent=fmt(d)}}catch{}}
$('seek').oninput=()=>{dragging=true;$('elapsed').textContent=fmt($('seek').value)};$('seek').onchange=()=>{if(playerReady){try{player.seekTo(Number($('seek').value),true)}catch{}}dragging=false};$('seek').onblur=()=>{dragging=false};
try{const v=localStorage.getItem('mx-volume');if(v!==null&&Number.isFinite(Number(v)))$('volume').value=Math.max(0,Math.min(100,Number(v)));$('autoplay').checked=localStorage.getItem('mx-autoplay')!=='false'}catch{}
$('volumeText').textContent=$('volume').value+'%';$('volume').oninput=()=>{const v=Number($('volume').value);$('volumeText').textContent=v+'%';try{localStorage.setItem('mx-volume',String(v));if(playerReady)player.setVolume(v)}catch{}};
$('autoplay').onchange=()=>{try{localStorage.setItem('mx-autoplay',String($('autoplay').checked))}catch{}drawUpcoming()};
$('sleep').onchange=()=>{const m=Number($('sleep').value);sleepAt=m?Date.now()+m*60000:0;$('sleepRemaining').textContent=m?fmt(m*60):''};
setInterval(()=>{updateProgress();if(sleepAt){const left=Math.ceil((sleepAt-Date.now())/1000);if(left<=0){stop();$('status').textContent='หยุดเพลงตามเวลาที่ตั้งไว้แล้ว'}else $('sleepRemaining').textContent=fmt(left)}},500);
function syncLists(){$('choose').replaceChildren();for(const l of lists){const o=document.createElement('option');o.value=l.id;o.textContent=l.name;$('choose').append(o)}if(!lists.some(x=>x.id===selected))selected=lists[0]?.id||'';$('choose').value=selected;$('delete').disabled=!selected}function createList(name){name=name.trim().slice(0,60);if(!name)return null;const l={id:crypto.randomUUID(),name,tracks:[]};lists.push(l);selected=l.id;save('mx-lists',lists);syncLists();return l}
function addList(t){let l;if(!lists.length){const n=prompt('ตั้งชื่อ Playlist');if(!n)return;l=createList(n)}else{const n=prompt('เลือกหมายเลข Playlist: '+lists.map((x,i)=>(i+1)+'. '+x.name).join(' / '),'1');if(n===null)return;l=lists[Number(n)-1]}if(!l)return;if(!l.tracks.some(x=>x.id===t.id))l.tracks.push(t);save('mx-lists',lists);$('status').textContent='บันทึกใน '+l.name}
function openLists(){seq++;mode('playlists');$('heading').textContent='Playlist ของคุณ';syncLists();const l=lists.find(x=>x.id===selected);show(l?.tracks||[]);$('status').textContent=l?(l.tracks.length?'':'Playlist ยังว่าง'):'สร้าง Playlist แรกของคุณ'}
$('playlists').onclick=openLists;$('create').onclick=()=>{if(createList($('pname').value)){$('pname').value='';openLists()}};$('choose').onchange=()=>{selected=$('choose').value;openLists()};$('delete').onclick=()=>{if(selected&&confirm('ลบ Playlist นี้?')){lists=lists.filter(x=>x.id!==selected);save('mx-lists',lists);openLists()}};

function drawRecent(){const box=$('recentTracks');box.replaceChildren();const tracks=hist.filter(valid).slice(0,4);$('recent').hidden=!tracks.length;for(const t of tracks){const b=btn('','เล่น '+t.title,()=>{start(t)});b.className='recenttrack';const image=coverFor(t);const text=document.createElement('div');const name=document.createElement('strong');name.textContent=t.title;const channel=document.createElement('small');channel.textContent=t.channel;text.append(name,channel);const play=document.createElement('span');play.textContent='▶';play.setAttribute('aria-hidden','true');b.append(image,text,play);box.append(b)}}
$('recentAll').onclick=()=>$('history').click();
function skeleton(){const box=$('tracks');box.replaceChildren();box.setAttribute('aria-busy','true');for(let i=0;i<10;i++){const item=document.createElement('div');item.className='skeleton';item.setAttribute('aria-hidden','true');for(const cls of ['skcover','skline','skshort']){const part=document.createElement('div');part.className=cls;item.append(part)}box.append(item)}}
async function load(url,title){const n=++seq;mode('home');if(url.startsWith('/api/discover'))drawRecent();else $('recent').hidden=true;$('heading').textContent=title;$('status').textContent='กำลังโหลดเพลง…';items=[];skeleton();try{const r=await fetch(url);const d=await r.json();if(n!==seq)return;if(!r.ok)throw Error(d.error||'โหลดเพลงไม่สำเร็จ');show((d.items||[]).map(clean));$('status').textContent=items.length?'':'ไม่พบเพลง'}catch(e){if(n===seq){show([]);$('status').textContent=e.message}}}
function clearMood(){for(const b of $('moods').children){b.classList.remove('active');b.setAttribute('aria-pressed','false')}}function discover(r){clearMood();region=r;$('th').classList.toggle('active',r==='TH');$('us').classList.toggle('active',r==='US');load('/api/discover?region='+r,r==='TH'?'เพลงยอดนิยมในไทย':'เพลงยอดนิยมในสหรัฐฯ')}
function search(q,label){if(q.trim()){clearMood();load('/api/search?q='+encodeURIComponent(q.trim()),label||'ผลการค้นหา · '+q);$('regions').hidden=true}}$('search').onsubmit=e=>{e.preventDefault();search($('q').value)};$('home').onclick=()=>discover(region);$('th').onclick=()=>discover('TH');$('us').onclick=()=>discover('US');for(const [label,q] of [['เพลงไทย','เพลงไทย official music video'],['เพลงสากล','pop music official video'],['เพลงออกใหม่','เพลงใหม่ official mv'],['Chill','lofi chill music'],['Rock','rock official music video'],['เพลงรัก','เพลงรัก official MV'],['Indie','Thai indie music'],['T-POP','T POP official music video'],['K-POP','Kpop official music video'],['J-POP','Japanese pop official music video'],['90s','เพลงไทยยุค 90 official'],['2000s','เพลงไทยยุค 2000 official'],['Acoustic','acoustic official music'],['เพลงเศร้า','เพลงเศร้า official MV'],['เพื่อชีวิต','เพลงเพื่อชีวิต official'],['ลูกทุ่ง','เพลงลูกทุ่ง official'],['Workout','workout music']]){const b=btn(label,label,()=>{search(q,label);b.classList.add('active');b.setAttribute('aria-pressed','true')});b.setAttribute('aria-pressed','false');$('moods').append(b)};for(const [id,label] of [['favorites','เพลงโปรด'],['history','ประวัติการฟัง']])$(id).onclick=()=>{seq++;mode(id);$('heading').textContent=label;show(id==='favorites'?fav:hist);$('status').textContent=items.length?'':'ยังไม่มีเพลง'};discover('TH');
</script></body></html>

<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUSICX — Amber</title><style>
:root{color-scheme:dark;--bg:#11100e;--panel:#1c1915;--line:#393027;--accent:#ff9d35;--muted:#b7a99a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8f3eb;font:15px system-ui,sans-serif}header{position:sticky;top:0;z-index:5;background:#14120f;display:flex;align-items:center;gap:20px;padding:15px 4%;border-bottom:1px solid var(--line);flex-wrap:wrap}.logo{font-size:25px;letter-spacing:-1.5px;color:var(--accent);font-weight:900}nav,form,.actions,.moods{display:flex;gap:8px;flex-wrap:wrap}form{flex:1;min-width:220px}input,select,button{font:inherit}input,select{background:#211e19;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;min-width:0}input{flex:1}button{cursor:pointer;border:1px solid transparent;border-radius:10px;background:#2b251d;color:#fff;padding:9px 13px}button:hover,button.active{background:var(--accent);color:#17110a}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ffb568;outline-offset:2px}main{max-width:1480px;margin:auto;padding:26px 4% 40px}.hero{padding:25px 30px;border:1px solid #624025;border-radius:20px;background:radial-gradient(ellipse at 90% 20%,#85411d,#332219 42%,#1e1a15 78%)}h1{font-size:clamp(28px,4vw,48px);letter-spacing:-.05em;margin:4px 0}h2{font-size:22px;margin:0}small,p{color:var(--muted)}.hero p{margin:8px 0}.moods{margin:20px 0}.moods button{border-color:var(--line)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:25px;align-items:start}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:15px}.track{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:10px;min-width:0}.thumb{width:100%;padding:0;position:relative;background:#30251b;overflow:hidden;display:block;border:0;aspect-ratio:16/9}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb span{position:absolute;right:8px;bottom:8px;background:var(--accent);color:#18110a;border-radius:50%;width:38px;height:38px;display:grid;place-items:center}.track strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px;margin:10px 0 4px;overflow-wrap:anywhere}.track p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;margin:0 0 10px}.actions button{padding:6px 10px}.side{position:sticky;top:90px;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px}.side h2{font-size:17px}.side iframe{width:100%;height:200px;border:0;border-radius:10px}.side h3{font-size:15px;overflow-wrap:anywhere}.queueitem{display:flex;gap:8px;align-items:center;margin:7px 0}.queueitem button:first-child{flex:1;text-align:left;overflow-wrap:anywhere}.queueitem button{font-size:12px}.queueitem button:last-child{flex:none}#queue{max-height:310px;overflow:auto}footer{text-align:center;color:var(--muted);font-size:12px;padding:20px} [hidden]{display:none!important}@media(max-width:950px){.layout{grid-template-columns:1fr}.side{position:static;grid-row:1}.side:has(#video:empty):has(#queue:empty){display:none}.side iframe{max-width:640px;height:auto;aspect-ratio:16/9;min-height:200px}header{position:static}}@media(max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.track{padding:7px}header{gap:10px}nav button{font-size:13px;padding:7px}main{padding:16px 12px}.hero{padding:20px}.actions{gap:4px}}
</style></head><body><header><div class="logo">◉ MUSICX</div><form id="search"><input id="q" aria-label="ค้นหาเพลง" placeholder="ค้นหาเพลง ศิลปิน หรืออัลบั้ม" maxlength="100" required><button class="active">ค้นหา</button></form><nav><button id="home" class="active">หน้าหลัก</button><button id="favorites">♡ เพลงโปรด</button><button id="playlists">Playlist</button><button id="history">ประวัติ</button></nav></header><main><div id="intro"><div class="hero"><small>AMBER SESSION</small><h1>Find your frequency.</h1><p>ค้นพบเสียงเพลงในแบบของคุณ</p></div><div class="moods" id="moods"></div></div><div class="layout"><div><div class="sectionhead"><h2 id="heading">เพลงยอดนิยมในไทย</h2><div id="regions"><button id="th" class="active">ไทย</button> <button id="us">สากล (US)</button></div></div><div id="plist" hidden><div class="actions"><input id="pname" maxlength="60" placeholder="ชื่อ Playlist ใหม่" aria-label="ชื่อ Playlist"><button id="create">สร้าง</button><select id="choose" aria-label="เลือก Playlist"></select><button id="delete">ลบ Playlist</button></div></div><p id="status" role="status"></p><div class="grid" id="tracks"></div></div><aside class="side" id="side"><h2>กำลังเล่น</h2><div id="video"></div><h3 id="now">เลือกเพลงเพื่อเริ่มฟัง</h3><div class="actions"><button id="next">เพลงถัดไป ⏭</button><button id="stop">หยุด</button></div><div class="sectionhead"><h2>คิวเพลง</h2><button id="clear">ล้างคิว</button></div><div id="queue"></div><p id="playerStatus" role="status"></p></aside></div></main><footer>MUSICX · Powered by YouTube</footer><script>
const $=id=>document.getElementById(id), read=(k)=>{try{const v=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(v)?v:[]}catch{return []}},save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let fav=read('mx-fav'),hist=read('mx-history'),lists=read('mx-lists'),queue=[],current=null,items=[],view='home',region='TH',seq=0,selected=lists[0]?.id||'',player=null,ready=false;
const valid=t=>t&&/^[\w-]{11}$/.test(t.id);const decode=s=>{const el=document.createElement('textarea');el.innerHTML=String(s||'').replace(/</g,'&lt;');return el.value};const clean=t=>({...t,title:decode(t.title),channel:decode(t.channel)});
function mode(v){view=v;for(const id of ['home','favorites','playlists','history'])$(id).classList.toggle('active',id===v);$('intro').hidden=v!=='home';$('regions').hidden=v!=='home';$('plist').hidden=v!=='playlists'}
function show(a){items=a.filter(valid);$('tracks').replaceChildren();for(const t of items){const card=document.createElement('article');card.className='track';const cover=document.createElement('button');cover.className='thumb';cover.setAttribute('aria-label','เล่น '+t.title);const img=document.createElement('img');img.src='https://i.ytimg.com/vi/'+t.id+'/mqdefault.jpg';img.alt='';img.loading='lazy';const icon=document.createElement('span');icon.textContent='▶';cover.append(img,icon);cover.onclick=()=>play(t);const name=document.createElement('strong');name.textContent=t.title;name.title=t.title;const channel=document.createElement('p');channel.textContent=t.channel;const actions=document.createElement('div');actions.className='actions';const heart=btn(fav.some(x=>x.id===t.id)?'♥':'♡','เพลงโปรด',()=>{fav=fav.some(x=>x.id===t.id)?fav.filter(x=>x.id!==t.id):[t,...fav];save('mx-fav',fav);show(view==='favorites'?fav:items)});const add=btn('+ คิว','เพิ่มคิว',()=>{queue.push(t);drawQueue();$('playerStatus').textContent='เพิ่มเข้าคิวแล้ว'});const list=btn(view==='playlists'?'−':'+ List',view==='playlists'?'นำออกจาก Playlist':'เพิ่มใน Playlist',()=>{if(view==='playlists'){const l=lists.find(x=>x.id===selected);if(l){l.tracks=l.tracks.filter(x=>x.id!==t.id);save('mx-lists',lists);show(l.tracks)}}else addList(t)});actions.append(heart,add,list);card.append(cover,name,channel,actions);$('tracks').append(card)}}
function btn(label,aria,fn){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-label',aria);b.onclick=fn;return b}
function drawQueue(){$('queue').replaceChildren();queue.forEach((t,i)=>{const row=document.createElement('div');row.className='queueitem';row.append(btn(t.title,'เล่น '+t.title,()=>{queue.splice(i,1);drawQueue();play(t)}),btn('×','นำออกจากคิว',()=>{queue.splice(i,1);drawQueue()}));$('queue').append(row)})}
window.onYouTubeIframeAPIReady=()=>{ready=true};const api=document.createElement('script');api.src='https://www.youtube.com/iframe_api';document.head.append(api);
function play(t){if(!valid(t))return;current=t;$('now').textContent=t.title;$('playerStatus').textContent='';hist=[t,...hist.filter(x=>x.id!==t.id)].slice(0,50);save('mx-history',hist);if(player){try{player.destroy()}catch{}player=null}$('video').replaceChildren();if(ready&&window.YT?.Player){const host=document.createElement('div');host.id='yt-player';$('video').append(host);player=new YT.Player(host,{videoId:t.id,width:'100%',height:'200',playerVars:{autoplay:1,playsinline:1,origin:location.origin},events:{onStateChange:e=>{if(e.data===YT.PlayerState.ENDED&&queue.length)next()},onError:()=>{$('playerStatus').textContent='วิดีโอนี้เล่นบนเว็บไม่ได้ ลองเพลงอื่น'}}})}else{const f=document.createElement('iframe');f.src='https://www.youtube-nocookie.com/embed/'+t.id+'?autoplay=1';f.title=t.title;f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;$('video').append(f)}if(matchMedia('(max-width:950px)').matches)$('side').scrollIntoView({behavior:'smooth',block:'start'})}
function next(){if(queue.length){const t=queue.shift();drawQueue();play(t)}else $('playerStatus').textContent='ไม่มีเพลงในคิว'}$('next').onclick=next;$('stop').onclick=()=>{if(player){try{player.destroy()}catch{}player=null}$('video').replaceChildren();current=null;$('now').textContent='เลือกเพลงเพื่อเริ่มฟัง'};$('clear').onclick=()=>{queue=[];drawQueue()};
function syncLists(){$('choose').replaceChildren();for(const l of lists){const o=document.createElement('option');o.value=l.id;o.textContent=l.name;$('choose').append(o)}if(!lists.some(x=>x.id===selected))selected=lists[0]?.id||'';$('choose').value=selected;$('delete').disabled=!selected}function createList(name){name=name.trim().slice(0,60);if(!name)return null;const l={id:crypto.randomUUID(),name,tracks:[]};lists.push(l);selected=l.id;save('mx-lists',lists);syncLists();return l}
function addList(t){let l;if(!lists.length){const n=prompt('ตั้งชื่อ Playlist');if(!n)return;l=createList(n)}else{const n=prompt('เลือกหมายเลข Playlist: '+lists.map((x,i)=>(i+1)+'. '+x.name).join(' / '),'1');if(n===null)return;l=lists[Number(n)-1]}if(!l)return;if(!l.tracks.some(x=>x.id===t.id))l.tracks.push(t);save('mx-lists',lists);$('status').textContent='บันทึกใน '+l.name}
function openLists(){seq++;mode('playlists');$('heading').textContent='Playlist ของคุณ';syncLists();const l=lists.find(x=>x.id===selected);show(l?.tracks||[]);$('status').textContent=l?(l.tracks.length?'':'Playlist ยังว่าง'):'สร้าง Playlist แรกของคุณ'}
$('playlists').onclick=openLists;$('create').onclick=()=>{if(createList($('pname').value)){$('pname').value='';openLists()}};$('choose').onchange=()=>{selected=$('choose').value;openLists()};$('delete').onclick=()=>{if(selected&&confirm('ลบ Playlist นี้?')){lists=lists.filter(x=>x.id!==selected);save('mx-lists',lists);openLists()}};
async function load(url,title){const n=++seq;mode('home');$('heading').textContent=title;$('status').textContent='กำลังโหลดเพลง…';show([]);try{const r=await fetch(url);const d=await r.json();if(n!==seq)return;if(!r.ok)throw Error(d.error||'โหลดเพลงไม่สำเร็จ');show((d.items||[]).map(clean));$('status').textContent=items.length?'':'ไม่พบเพลง'}catch(e){if(n===seq)$('status').textContent=e.message}}
function discover(r){region=r;$('th').classList.toggle('active',r==='TH');$('us').classList.toggle('active',r==='US');load('/api/discover?region='+r,r==='TH'?'เพลงยอดนิยมในไทย':'เพลงยอดนิยมในสหรัฐฯ')}
function search(q){if(q.trim())load('/api/search?q='+encodeURIComponent(q.trim()),'ผลการค้นหา · '+q)}$('search').onsubmit=e=>{e.preventDefault();search($('q').value)};$('home').onclick=()=>discover(region);$('th').onclick=()=>discover('TH');$('us').onclick=()=>discover('US');for(const [label,q] of [['เพลงไทย','เพลงไทย official music video'],['เพลงสากล','pop music official video'],['เพลงออกใหม่','เพลงใหม่ official mv'],['Chill','lofi chill music'],['Rock','rock official music video'],['เพลงรัก','เพลงรัก official MV'],['Indie','Thai indie music']])$('moods').append(btn(label,label,()=>search(q)));for(const [id,label] of [['favorites','เพลงโปรด'],['history','ประวัติการฟัง']])$(id).onclick=()=>{seq++;mode(id);$('heading').textContent=label;show(id==='favorites'?fav:hist);$('status').textContent=items.length?'':'ยังไม่มีเพลง'};discover('TH');
</script></body></html>
